<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>note 記事の作業机</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#263c35;background:#f5f6f2;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #d4ded7;border-radius:10px;background:white;color:#263c35;padding:10px 15px}button:hover{background:#edf3ef}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #e1a756;outline-offset:3px}.primary{background:#28684f;color:white;border-color:#28684f}.primary:hover{background:#1d513d}header{max-width:1260px;margin:auto;padding:36px 28px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:26px;letter-spacing:.04em;margin:7px 0}p{line-height:1.7}header p{margin:0;color:#62736a;font-size:14px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#44745c}main{max-width:1260px;margin:auto;padding:0 28px 30px;display:grid;grid-template-columns:300px 1fr;gap:22px}.panel{background:white;border:1px solid #dfe5de;border-radius:18px;box-shadow:0 4px 16px #263c3505}aside{padding:22px;align-self:start}h2{font-size:17px;margin:0 0 18px}.aside-top{display:flex;align-items:center;justify-content:space-between}.aside-top span{font-size:12px;background:#edf3ef;padding:5px 9px;border-radius:20px}#search{width:100%;padding:11px;border:1px solid #d4ded7;border-radius:9px;margin-bottom:15px}.article{display:block;text-align:left;width:100%;margin:8px 0;padding:14px;overflow-wrap:anywhere}.article.active{border-color:#28684f;background:#edf5ef}.article strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.article small{display:block;color:#6c7a71;margin-top:7px;font-size:11px}.empty{font-size:14px;color:#6c7a71;padding:22px 0}.editor{padding:28px}.editor-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.editor-top h2{margin:0;font-size:20px}.state{font-size:12px;color:#6c7a71}.field-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;gap:12px}label{font-weight:600;font-size:14px}.copy{font-size:12px;padding:7px 12px}#title,#body{width:100%;border:1px solid #d4ded7;border-radius:10px;background:#fcfdfb;padding:14px}#title{font-size:18px}#body{min-height:370px;resize:vertical;line-height:1.9}.meta{display:flex;justify-content:space-between;font-size:12px;color:#6c7a71;margin-top:10px}.actions{display:flex;align-items:center;gap:12px;border-top:1px solid #e5ebe5;margin-top:25px;padding-top:22px}.danger{color:#945044;margin-left:auto}.hint{font-size:12px;color:#6c7a71;margin:18px 0 0}.backup{margin-top:22px;padding-top:18px;border-top:1px solid #e5ebe5}.backup button{font-size:12px;width:100%;margin-top:8px}#message{max-width:1204px;margin:0 auto 18px;padding:12px 16px;border-radius:10px;background:#e7f0e9;line-height:1.6;font-size:14px}#message:empty{display:none}#message.error{background:#fff0eb;color:#8a3829}a{color:#28684f}footer{max-width:1260px;margin:0 auto;padding:0 28px 28px;color:#6c7a71;font-size:12px}@media(max-width:760px){header{padding:24px 18px;align-items:flex-start}header h1{font-size:21px}header p{font-size:12px}main{padding:0 18px 24px;grid-template-columns:1fr}.editor{padding:20px}#body{min-height:300px}#list{max-height:230px;overflow:auto}.actions{flex-wrap:wrap}#message{margin:0 18px 18px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">MY WRITING DESK</div><h1>note 記事の作業机</h1><p>書く。整える。コピーして、noteへ。</p></div><button id="new" class="primary">＋ 新しい記事</button></header>
<div id="message" role="status" aria-live="polite"></div>
<main>
<aside class="panel"><div class="aside-top"><h2>保存した記事</h2><span id="total">0件</span></div><label for="search" class="state">記事を探す</label><input id="search" type="search" placeholder="タイトル・本文で検索"><div id="list"></div><div class="backup"><button id="export">バックアップを書き出す</button><button id="import">バックアップを読み込む</button><input id="import-file" type="file" accept="application/json,.json" hidden><p class="hint">大切な記事はバックアップも残しておこう。</p></div></aside>
<section class="panel editor" aria-label="記事の編集"><div class="editor-top"><h2 id="editor-heading">新しい記事</h2><span id="state" class="state">未保存</span></div>
<div class="field-head"><label for="title">タイトル</label><button class="copy" id="copy-title">タイトルをコピー</button></div><input id="title" placeholder="記事のタイトルを入力" autocomplete="off">
<div class="field-head"><label for="body">本文</label><button class="copy" id="copy-body">本文をコピー</button></div><textarea id="body" placeholder="完成した記事を貼り付けたり、ここで書いたりできます。"></textarea>
<div class="meta"><span id="chars">本文 0文字</span><span>Ctrl / ⌘ ＋ S で保存</span></div>
<div class="actions"><button class="primary" id="save">記事を保存</button><a href="https://note.com/" target="_blank" rel="noopener noreferrer">noteを開く ↗</a><button class="danger" id="delete" hidden>この記事を削除</button></div>
<p class="hint">編集後は「記事を保存」を押してください。記事はこの端末・このブラウザに保存されます。noteへの投稿は、コピーした文章をnoteに貼り付けて行います。</p></section>
</main><footer>アカウント登録不要。入力した記事を外部へ送信しません。ブラウザのデータを消すと記事も消えるため、バックアップをご利用ください。</footer>
<script>
'use strict';
const KEY='note-writing-desk.v1';
const $=id=>document.getElementById(id);
let articles=[],currentId=null,dirty=false,storageOK=true;
function say(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
function validArticle(a){return a&&typeof a.id==='string'&&a.id.length>0&&typeof a.title==='string'&&typeof a.body==='string'&&typeof a.updatedAt==='string'&&Number.isFinite(Date.parse(a.updatedAt))}
function validCollection(data){return Array.isArray(data)&&data.every(validArticle)&&new Set(data.map(a=>a.id)).size===data.length}
try{const raw=localStorage.getItem(KEY);if(raw!==null){const data=JSON.parse(raw);if(!validCollection(data))throw Error('Invalid data');articles=data}}catch(e){storageOK=false;say('保存データを読み込めませんでした。上書きを防ぐため保存を停止しています。ブラウザの保存設定を確認してください。入力した文章はコピーできます。',true)}
function persist(next){if(!storageOK){say('保存を利用できません。文章をコピーして別の場所に残してください。',true);return false}try{localStorage.setItem(KEY,JSON.stringify(next));articles=next;return true}catch(e){say('保存できませんでした。保存容量やブラウザの設定を確認し、文章をコピーして残してください。',true);return false}}
function dateLabel(s){return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(s))}
function renderList(){const list=$('list');list.replaceChildren();$('total').textContent=articles.length+'件';const q=$('search').value.toLocaleLowerCase();const matches=articles.filter(a=>(a.title+'\n'+a.body).toLocaleLowerCase().includes(q)).sort((a,b)=>Date.parse(b.updatedAt)-Date.parse(a.updatedAt));if(!matches.length){const p=document.createElement('p');p.className='empty';p.textContent=articles.length?'見つかりませんでした。':'まだ記事がありません。\n右の画面で最初の記事を書こう。';list.append(p)}for(const a of matches){const b=document.createElement('button');b.className='article'+(a.id===currentId?' active':'');b.setAttribute('aria-pressed',a.id===currentId?'true':'false');const t=document.createElement('strong');t.textContent=a.title||'無題の記事';const s=document.createElement('small');s.textContent=dateLabel(a.updatedAt)+' 更新 ・ '+Array.from(a.body).length+'文字';b.append(t,s);b.addEventListener('click',()=>openArticle(a.id));list.append(b)}}
function updateState(){const a=articles.find(a=>a.id===currentId);$('state').textContent=dirty?'変更あり・未保存':a?'保存済み '+dateLabel(a.updatedAt):'未保存';$('editor-heading').textContent=currentId?'記事を編集':'新しい記事';$('delete').hidden=!currentId;$('chars').textContent='本文 '+Array.from($('body').value).length+'文字'}
function mayLeave(){return !dirty||confirm('保存していない変更があります。変更を破棄して移動しますか？')}
function openArticle(id){if(!mayLeave())return;const a=articles.find(a=>a.id===id);if(!a)return;currentId=id;$('title').value=a.title;$('body').value=a.body;dirty=false;updateState();renderList()}
function fresh(){if(!mayLeave())return;currentId=null;$('title').value='';$('body').value='';dirty=false;updateState();renderList();$('title').focus()}
function save(){const title=$('title').value,body=$('body').value;if(!title.trim()&&!body.trim()){say('タイトルか本文を入力してから保存してください。',true);return}const id=currentId||('article-'+Date.now()+'-'+Math.random().toString(36).slice(2));const article={id,title,body,updatedAt:new Date().toISOString()};const next=articles.filter(a=>a.id!==id).concat(article);if(persist(next)){currentId=id;dirty=false;updateState();renderList();say('記事を保存しました。')}}
async function copyField(id){const field=$(id),text=field.value;if(!text){say('コピーする文章を入力してください。',true);return}try{if(!navigator.clipboard||!window.isSecureContext)throw Error('fallback');await navigator.clipboard.writeText(text)}catch(e){field.focus();field.select();let success=false;try{success=document.execCommand('copy')}catch(e){}if(!success){say('文章を選択しました。Ctrl＋C（Macは⌘＋C）でコピーしてください。',true);return}}say((id==='title'?'タイトル':'本文')+'をコピーしました。')}
$('new').onclick=fresh;$('save').onclick=save;$('search').oninput=renderList;
for(const id of ['title','body']){$(id).oninput=()=>{dirty=true;updateState()};$('copy-'+id).onclick=()=>copyField(id)}
$('delete').onclick=()=>{if(!currentId||!confirm('この記事を削除しますか？削除すると元に戻せません。'))return;if(persist(articles.filter(a=>a.id!==currentId))){dirty=false;fresh();say('記事を削除しました。')}};
$('export').onclick=()=>{if(dirty&&!confirm('未保存の編集内容は含まれません。保存済みの記事を書き出しますか？'))return;const blob=new Blob([JSON.stringify({version:1,articles},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='note-articles-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('保存済みの記事のバックアップを書き出しました。')};
$('import').onclick=()=> $('import-file').click();
$('import-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==1||!validCollection(data.articles))throw Error('Invalid backup');if(!data.articles.length){say('バックアップに記事がありません。',true);return}if(!mayLeave())return;if(!confirm(data.articles.length+'件を追加します。既存の記事は残ります。読み込みますか？'))return;const stamp=Date.now();const additions=data.articles.map((a,i)=>({...a,id:'import-'+stamp+'-'+i+'-'+Math.random().toString(36).slice(2)}));if(persist(articles.concat(additions))){dirty=false;openArticle(additions[0].id);say(additions.length+'件の記事を読み込みました。')}}catch(e){say('バックアップを読み込めませんでした。このツールで書き出したJSONファイルを選んでください。',true)}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}});
renderList();updateState();
</script>
</body></html>
