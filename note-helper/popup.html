<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>note 下書き入力</title><style>
body{font-family:system-ui,sans-serif;width:350px;padding:18px;color:#263c35;margin:0}h1{font-size:19px;margin:0 0 14px}p{font-size:13px;line-height:1.7}label{font-size:13px;display:block;margin:12px 0 7px}textarea{box-sizing:border-box;width:100%;height:180px;border:1px solid #bdcec3;border-radius:8px;padding:10px;font:13px system-ui}button{width:100%;padding:12px;border:0;border-radius:8px;background:#28684f;color:white;font-size:14px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4ef;padding:10px;border-radius:8px}#status:empty{display:none}.check{display:flex;gap:8px;align-items:center;margin:15px 0}small{font-size:11px;color:#68786f}
</style></head><body><h1>noteへまとめて入力</h1><p>① 作業机で「note用データをコピー」<br>② 空のnote編集画面でこの機能を開く<br>③ 下の欄に貼り付けて、入力ボタンを押す</p><label for="data">記事データを貼り付け</label><textarea id="data" placeholder="ここにCtrl＋Vで貼り付け"></textarea><label class="check"><input id="save" type="checkbox">入力後に「下書き保存」も押す</label><button id="run">開いているnoteに入力する</button><p id="status" role="status" aria-live="polite"></p><small>空の編集画面専用です。既存の文章がある場合は停止します。この入力ボタンは公開操作を行いません。パスワードの入力は不要です。</small><hr><h1>時間指定で公開</h1><p>noteの公開設定画面で使います。設定時点の記事と公開設定のまま、指定時刻に「投稿する」を1回押します。</p><label for="publish-time">公開する日時（PCの現地時間）</label><input id="publish-time" type="datetime-local" style="width:100%;box-sizing:border-box;padding:10px"><label class="check"><input id="publish-consent" type="checkbox">この記事と公開設定を確認しました。指定時刻の公開を許可します。</label><button id="schedule">このタブの公開タイマーを開始</button><p><button id="cancel-timer" style="background:#68786f">タイマーを取り消す</button></p><button id="timer-status" style="background:#68786f">このタブのタイマー状態を見る</button><p id="timer-message" role="status" aria-live="polite" style="white-space:pre-wrap"></p><small>PCのスリープ・Braveの終了・タブを閉じる・再読み込みで動かなくなります。公開設定の変更や2分以上の遅れを検出したら停止します。追加の確認画面が出た場合は自動で進みません。</small><script src="timer.js"></script><script src="inject.js"></script><script src="popup.js"></script></body></html>
